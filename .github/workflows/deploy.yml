name: CI/CD - Compass

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet de relancer manuellement un deploiement depuis l'onglet Actions,
  # sans avoir a produire un commit.
  workflow_dispatch:

# Moindre privilege : par defaut le GITHUB_TOKEN n'a qu'un acces en lecture.
# Chaque job reouvre uniquement les droits dont il a besoin.
permissions:
  contents: read

# Une seule mise en production a la fois. Les runs obsoletes sont annules :
# le site etant integralement regenere a chaque build, seul le dernier commit
# a un interet. Sans cela, une serie de fusions rapprochees empile les
# deploiements Pages et les fait expirer sur le timeout de deploy-pages.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualite et securite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      # --frozen-lockfile : echec si package.json et pnpm-lock.yaml divergent.
      # Garantit une installation identique a l'environnement de developpement.
      - name: Installation des dependances
        run: pnpm install --frozen-lockfile

      # Validation TypeScript des composants Astro et des schemas de contenu.
      - name: Verification des types
        run: pnpm check

      # Seuil bloquant : toute vulnerabilite critique arrete la chaine.
      - name: Audit de securite (bloquant)
        run: pnpm audit --audit-level=critical

      # Rapport complet a titre informatif, non bloquant.
      - name: Rapport de vulnerabilites (informatif)
        if: always()
        continue-on-error: true
        run: pnpm audit

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Installation des dependances
        run: pnpm install --frozen-lockfile

      - name: Generation du site statique
        run: pnpm build

      # L'artefact n'est televerse que pour une mise en production reelle,
      # donc jamais depuis une pull request.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Mise en production
    needs: build
    # Le deploiement n'a jamais lieu depuis une pull request, mais reste
    # possible sur un push vers main comme sur un declenchement manuel.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publication sur GitHub Pages
      id-token: write   # jeton OIDC ephemere, aucun secret stocke
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
