name: CI/CD - Compass

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Moindre privilege : par defaut le GITHUB_TOKEN n'a qu'un acces en lecture.
# Chaque job reouvre uniquement les droits dont il a besoin.
permissions:
  contents: read

# Une seule mise en production a la fois ; les runs de PR obsoletes sont annules.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Qualite et securite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      # --frozen-lockfile : echec si package.json et pnpm-lock.yaml divergent.
      # Garantit une installation identique a l'environnement de developpement.
      - name: Installation des dependances
        run: pnpm install --frozen-lockfile

      # Validation TypeScript des composants Astro et des schemas de contenu.
      - name: Verification des types
        run: pnpm check

      # Seuil bloquant : toute vulnerabilite critique arrete la chaine.
      - name: Audit de securite (bloquant)
        run: pnpm audit --audit-level=critical

      # Rapport complet a titre informatif, non bloquant.
      - name: Rapport de vulnerabilites (informatif)
        if: always()
        continue-on-error: true
        run: pnpm audit

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installation des dependances
        run: pnpm install --frozen-lockfile

      - name: Generation du site statique
        run: pnpm build

      # L'artefact n'est televerse que pour une mise en production reelle.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    name: Mise en production
    needs: build
    # Le deploiement n'a jamais lieu depuis une pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publication sur GitHub Pages
      id-token: write   # jeton OIDC ephemere, aucun secret stocke
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
